name: Windows build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore UniversalSearch.sln
      - run: dotnet build UniversalSearch.sln -c Release --no-restore
      - run: dotnet test UniversalSearch.sln -c Release --no-build
